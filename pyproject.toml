[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "circa"
version = "1.0.0"
description = "Code for 'Advancing Regulation in Artificial Intelligence: An Auction-Based Approach' (FAccT '26)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Marco Bornstein" },
    { name = "Zora Che" },
    { name = "Suhas Julapalli" },
    { name = "Abdirisak Mohamed" },
    { name = "Amrit Singh Bedi" },
    { name = "Furong Huang" },
]
keywords = ["AI regulation", "auction", "mechanism design", "Nash equilibrium", "AI safety", "fairness"]
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=7"]
fairness = ["torch>=2.1", "torchvision>=0.16", "pandas>=2.0", "pillow"]

[project.urls]
Paper = "https://doi.org/10.1145/3805689.3812397"
arXiv = "https://arxiv.org/abs/2410.01871"
Repository = "https://github.com/marcobornstein/AI-Regulatory-Auctions"

[tool.setuptools]
packages = ["circa"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
